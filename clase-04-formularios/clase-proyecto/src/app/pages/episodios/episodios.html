<section class="mx-auto max-w-2xl px-6 py-10">
  <header>
    <h1 class="text-3xl font-bold tracking-tight">Episodios favoritos</h1>
    <p class="mt-1 text-slate-500">Un campo por episodio: se agregan y se quitan</p>
  </header>

  <form
    [formArray]="formulario"
    class="mt-8 space-y-3 rounded-xl border border-slate-200 bg-white p-6"
  >
    @for (item of formulario.controls; track $index; let i = $index) {
      <div>
        <label [for]="'episodio-' + i" class="block text-sm font-medium"
          >Episodio {{ i + 1 }}</label
        >
        <input
          [id]="'episodio-' + i"
          [formControlName]="i"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-slate-900 focus:outline-none"
        />
      </div>
    }

    <div class="flex gap-3 pt-2">
      <button
        type="button"
        (click)="agregar()"
        class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-700"
      >
        Agregar
      </button>
      <button
        type="button"
        (click)="quitar()"
        [disabled]="formulario.length === 1"
        class="rounded-lg px-4 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 disabled:opacity-40"
      >
        Quitar el último
      </button>
    </div>
  </form>

  <pre class="mt-6 rounded-xl border border-slate-200 bg-white p-4 text-xs">{{
    formulario.value
  }}</pre>
</section>

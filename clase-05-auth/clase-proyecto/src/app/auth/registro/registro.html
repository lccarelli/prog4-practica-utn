<section class="mx-auto max-w-md px-6 py-10">
  <header>
    <h1 class="text-3xl font-bold tracking-tight">Registro</h1>
    <p class="mt-1 text-slate-500">El nombre se guarda en los metadatos del usuario</p>
  </header>

  @if (revisarCorreo()) {
    <p class="mt-8 rounded-lg border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-800">
      Te mandamos un correo para confirmar la cuenta. Después de confirmarla, ingresá.
    </p>
  } @else {
    <form
      [formGroup]="formulario"
      (ngSubmit)="registrar()"
      class="mt-8 space-y-5 rounded-xl border border-slate-200 bg-white p-6"
    >
      <div>
        <label for="nombre" class="block text-sm font-medium">Nombre</label>
        <input
          id="nombre"
          type="text"
          formControlName="nombre"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-slate-900 focus:outline-none"
        />
        <app-errores
          [errores]="formulario.controls.nombre.touched ? formulario.controls.nombre.errors : null"
        />
      </div>
      <div>
        <label for="email" class="block text-sm font-medium">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-slate-900 focus:outline-none"
        />
        <app-errores
          [errores]="formulario.controls.email.touched ? formulario.controls.email.errors : null"
        />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-slate-900 focus:outline-none"
        />
        <app-errores
          [errores]="
            formulario.controls.password.touched ? formulario.controls.password.errors : null
          "
        />
      </div>

      @if (error(); as mensaje) {
        <p class="rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700">
          {{ mensaje }}
        </p>
      }

      <button
        type="submit"
        class="w-full rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-slate-700"
      >
        Crear cuenta
      </button>
    </form>
  }

  <p class="mt-4 text-center text-sm text-slate-500">
    ¿Ya tenés cuenta?
    <a routerLink="/auth/login" class="font-medium text-slate-900 underline">Ingresá</a>
  </p>
</section>

<div class="min-h-dvh bg-slate-50 text-slate-900">
  <nav class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl gap-2 px-6 py-3">
      <!--
        #catalogo="routerLinkActive" expone la directiva como variable de template.
        Con isActive elegimos un juego de clases u otro, en vez de superponerlos
        y depender de cuál regla de Tailwind gana.
      -->
      <a
        routerLink="/"
        routerLinkActive
        #catalogo="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-lg px-4 py-2 text-sm font-medium transition"
        [class]="
          catalogo.isActive ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'
        "
      >
        Catálogo
      </a>
      <a
        routerLink="/formulario"
        routerLinkActive
        #formulario="routerLinkActive"
        class="rounded-lg px-4 py-2 text-sm font-medium transition"
        [class]="
          formulario.isActive ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'
        "
      >
        Formulario
      </a>
      <a
        routerLink="/episodios"
        routerLinkActive
        #episodios="routerLinkActive"
        class="rounded-lg px-4 py-2 text-sm font-medium transition"
        [class]="
          episodios.isActive ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'
        "
      >
        Episodios
      </a>

      <div class="ml-auto flex items-center gap-3 text-sm">
        @if (auth.usuarioActual(); as usuario) {
          <span class="text-slate-500">{{ usuario.user_metadata['nombre'] ?? usuario.email }}</span>
          <button
            (click)="salir()"
            class="rounded-lg px-4 py-2 font-medium text-slate-600 transition hover:bg-slate-100"
          >
            Salir
          </button>
        } @else {
          <a
            routerLink="/auth/login"
            class="rounded-lg px-4 py-2 font-medium text-slate-600 transition hover:bg-slate-100"
          >
            Ingresar
          </a>
        }
      </div>
    </div>
  </nav>

  <router-outlet />
</div>

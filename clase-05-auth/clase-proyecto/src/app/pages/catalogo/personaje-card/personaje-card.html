<article
  class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-0.5 hover:shadow-md"
>
  <img
    [src]="personaje().image"
    [alt]="personaje().name"
    class="aspect-square w-full object-cover"
    loading="lazy"
  />

  <div class="p-4">
    <h2 class="truncate font-semibold" [title]="personaje().name">{{ personaje().name }}</h2>

    <p class="mt-1 flex items-center gap-2 text-sm text-slate-500">
      <span class="inline-block size-2 shrink-0 rounded-full" [class]="colorEstado()"></span>
      {{ personaje().status }} · {{ personaje().species }}
    </p>

    <dl class="mt-3 space-y-0.5 text-xs text-slate-500">
      <div class="flex gap-1">
        <dt class="shrink-0 text-slate-400">Origen:</dt>
        <dd class="truncate">{{ personaje().origin.name }}</dd>
      </div>
      <div class="flex gap-1">
        <dt class="shrink-0 text-slate-400">Ubicación:</dt>
        <dd class="truncate">{{ personaje().location.name }}</dd>
      </div>
    </dl>
  </div>
</article>
